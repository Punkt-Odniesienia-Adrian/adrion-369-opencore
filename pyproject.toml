[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adrion-opencore"
version = "0.1.0"
description = "ADRION 369 open-core SDK — transparency, causality and consistency checks for autonomous AI agent decisions."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Adrian Halicki"}]

[tool.setuptools.packages.find]
where = ["src"]
